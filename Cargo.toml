[workspace]
resolver = "3"
members = ["apps/*", "shell/*"]

[workspace.dependencies]
wavelet_core = { path = "shell/wavelet_core" }
wavelet_ui = { path = "shell/wavelet_ui" }

slint = { version = "1.19.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "backend-winit-wayland",
    "renderer-software",
] }
slint-build = "1.19.1"
jiff = "1.0.3"
