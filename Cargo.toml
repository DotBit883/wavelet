[workspace]
resolver = "3"
members = ["apps/*", "shell/*"]

[workspace.dependencies]
wavelet_core = { path = "shell/wavelet_core" }
wavelet_ui = { path = "shell/wavelet_ui" }

iced = { version = "0.14.0", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "thread-pool",
    "crisp",
    "svg",
] }
lucide-icons = { version = "1.79.0", features = ["iced"] }
jiff = "1.0.3"
